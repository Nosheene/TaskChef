<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskChef - Détail tâche</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="task-detail">
    <a class="skip-link" href="#main-content">Aller au contenu principal</a>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">TaskChef</a>
        <a class="btn btn-outline-secondary btn-sm" href="index.html">Retour au tableau de bord</a>
      </div>
    </nav>

    <main id="main-content" class="container py-4">
      <section class="card shadow-sm form-card">
        <div class="card-body p-4">
          <h1 class="h3 mb-1">Détail de la tâche</h1>
          <p class="text-muted mb-4">Modifier la tâche ou la supprimer (admin uniquement).</p>

          <div id="alert" class="alert d-none" role="alert"></div>

          <form id="taskDetailForm">
            <div class="mb-3">
              <label for="title" class="form-label">Titre</label>
              <input id="title" class="form-control" type="text" required minlength="3" />
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea id="description" class="form-control" rows="4"></textarea>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label for="status" class="form-label">Statut</label>
                <select id="status" class="form-select">
                  <option value="a_faire">À faire</option>
                  <option value="en_cours">En cours</option>
                  <option value="termine">Terminé</option>
                </select>
              </div>

              <div class="col-md-4 mb-3">
                <label for="priority" class="form-label">Priorité</label>
                <select id="priority" class="form-select">
                  <option value="basse">Basse</option>
                  <option value="moyenne">Moyenne</option>
                  <option value="haute">Haute</option>
                </select>
              </div>

              <div class="col-md-4 mb-3">
                <label for="deadline" class="form-label">Date limite</label>
                <input id="deadline" class="form-control" type="date" />
              </div>
            </div>

            <div class="d-flex flex-wrap gap-2">
              <button class="btn btn-primary" type="submit">Enregistrer les modifications</button>
              <button id="deleteTaskBtn" class="btn btn-outline-danger d-none" type="button">
                Supprimer la tâche
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
