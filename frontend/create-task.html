<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskChef - Créer une tâche</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body data-page="create-task">
    <a class="skip-link" href="#main-content">Aller au contenu principal</a>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a
          class="brand-link d-inline-flex align-items-center gap-2 text-decoration-none"
          href="index.html"
        >
          <img class="brand-logo" src="assets/Book_check_light.svg" width="36" height="36" alt="" decoding="async" />
          TaskChef
        </a>
        <a class="btn btn-primary btn-sm" href="index.html">Retour</a>
      </div>
    </nav>

    <main id="main-content" class="container py-4">
      <section class="card shadow-sm form-card">
        <div class="card-body p-4">
          <h1 class="h3 mb-1">Créer une tâche</h1>
          <p class="text-muted mb-4">Cette action utilise une route protégée par JWT.</p>

          <div id="alert" class="alert d-none" role="alert"></div>

          <form id="taskForm">
            <div class="mb-3">
              <label for="title" class="form-label">Titre</label>
              <input id="title" class="form-control" type="text" required minlength="3" />
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea id="description" class="form-control" rows="4"></textarea>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label for="status" class="form-label">Statut</label>
                <select id="status" class="form-select">
                  <option value="a_faire">À faire</option>
                  <option value="en_cours">En cours</option>
                  <option value="termine">Terminé</option>
                </select>
              </div>

              <div class="col-md-4 mb-3">
                <label for="priority" class="form-label">Priorité</label>
                <select id="priority" class="form-select">
                  <option value="basse">Basse</option>
                  <option value="moyenne" selected>Moyenne</option>
                  <option value="haute">Haute</option>
                </select>
              </div>

              <div class="col-md-4 mb-3">
                <label for="deadline" class="form-label">Date limite</label>
                <input id="deadline" class="form-control" type="date" />
              </div>
            </div>

            <button class="btn btn-primary" type="submit">Créer la tâche</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer" role="contentinfo">
      <p>© 2026 TaskChef — Organisez vos tâches et suivez l’avancement au quotidien.</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
