<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskChef - Connexion</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="login">
    <a class="skip-link" href="#main-content">Aller au contenu principal</a>
    <main id="main-content" class="auth-page">
      <section class="card auth-card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 mb-2">TaskChef</h1>
          <p class="text-muted mb-4">Connectez-vous pour gérer vos tâches.</p>

          <div id="alert" class="alert d-none" role="alert"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                id="email"
                class="form-control"
                type="email"
                value="test@taskchef.local"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Mot de passe</label>
              <input
                id="password"
                class="form-control"
                type="password"
                value="Test12345"
                required
              />
            </div>

            <button class="btn btn-primary w-100" type="submit">Se connecter</button>
          </form>

          <p class="text-center mt-3 mb-0">
            Pas encore de compte ?
            <a href="register.html">Créer un compte</a>
          </p>
        </div>
      </section>
    </main>

    <footer class="site-footer" role="contentinfo">
      <p>© 2026 TaskChef — Organisez vos tâches et suivez l’avancement au quotidien.</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
