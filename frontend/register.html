<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskChef - Inscription</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body data-page="register">
    <a class="skip-link" href="#main-content">Aller au contenu principal</a>
    <main id="main-content" class="auth-page">
      <section class="card auth-card shadow-sm">
        <div class="card-body p-4">
          <img
            class="auth-brand-logo d-block mx-auto mb-2"
            src="assets/Book_check_light.svg"
            width="56"
            height="56"
            alt=""
            decoding="async"
          />
          <h1 class="h3 mb-2 text-center">Créer un compte</h1>
          <p class="text-muted mb-4 text-center">Inscrivez-vous pour accéder à TaskChef.</p>

          <div id="alert" class="alert d-none" role="alert"></div>

          <form id="registerForm">
            <div class="mb-3">
              <label for="name" class="form-label">Nom</label>
              <input id="name" class="form-control" type="text" required minlength="2" />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input id="email" class="form-control" type="email" required />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Mot de passe</label>
              <input id="password" class="form-control" type="password" required minlength="8" />
              <div class="form-text">Minimum 8 caractères.</div>
            </div>

            <button class="btn btn-primary w-100" type="submit">Créer mon compte</button>
          </form>

          <p class="text-center mt-3 mb-0">
            Déjà un compte ?
            <a href="login.html">Se connecter</a>
          </p>
        </div>
      </section>
    </main>

    <footer class="site-footer" role="contentinfo">
      <p>© 2026 TaskChef — Organisez vos tâches et suivez l’avancement au quotidien.</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
