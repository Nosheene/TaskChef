<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskChef - Tableau de bord</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="dashboard">
    <a class="skip-link" href="#main-content">Aller au contenu principal</a>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">TaskChef</a>
        <div class="d-flex gap-2">
          <a class="btn btn-primary btn-sm" href="create-task.html">Nouvelle tâche</a>
          <button id="logoutBtn" class="btn btn-primary btn-sm" type="button">Déconnexion</button>
        </div>
      </div>
    </nav>

    <main id="main-content" class="container py-4">
      <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-4">
        <div>
          <h1 class="h2 mb-1">Tableau de bord</h1>
          <p class="text-muted mb-0">Vue d’ensemble de vos tâches et de l’activité récente.</p>
        </div>
        <select id="statusFilter" class="form-select filter-select" aria-label="Filtrer par statut">
          <option value="">Tous les statuts</option>
          <option value="a_faire">À faire</option>
          <option value="en_cours">En cours</option>
          <option value="termine">Terminé</option>
        </select>
      </div>

      <div id="alert" class="alert d-none" role="alert"></div>
      <section id="tasksList" class="tasks-grid"></section>

      <section class="mt-5">
        <h2 class="h4">Logs d'activité NoSQL</h2>
        <p class="text-muted">Dernières actions enregistrées dans MongoDB.</p>
        <div id="logsList" class="list-group"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
